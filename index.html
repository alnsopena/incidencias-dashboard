<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1"><style>:root{color-scheme:light}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found]){display:none!important}</style></head><body>
<title>Incidencias &amp; Mejoras Go Live en vivo</title>
<style>
  :root {
    --ground: #f5f7f8;
    --surface: #ffffff;
    --surface-sunken: #eef1f3;
    --border: #dde3e7;
    --ink: #16232c;
    --ink-soft: #4c5c66;
    --ink-faint: #7c8b93;
    --accent: #1d5c74;
    --accent-soft: #d7e6ea;
    --accent-strong: #0f3d4f;
    --crit: #c1443a;
    --crit-bg: #fbe8e6;
    --alta: #c97a2b;
    --alta-bg: #fbedde;
    --media: #2f8f86;
    --media-bg: #e2f1ee;
    --baja: #6b7f8c;
    --baja-bg: #eaeef0;
    --good: #2c8a5b;
    --good-bg: #e3f2e9;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #10161b;
      --surface: #172127;
      --surface-sunken: #1c2830;
      --border: #2a3941;
      --ink: #e8edef;
      --ink-soft: #aebbc1;
      --ink-faint: #7c8b93;
      --accent: #5fa9c2;
      --accent-soft: #22333a;
      --accent-strong: #8ec5d8;
      --crit: #e2716a;
      --crit-bg: #2e1c1c;
      --alta: #dba05a;
      --alta-bg: #2e2418;
      --media: #5cbdb2;
      --media-bg: #17302c;
      --baja: #93a5b0;
      --baja-bg: #202b31;
      --good: #63be8f;
      --good-bg: #16281f;
    }
  }

  :root[data-theme="dark"] {
    --ground: #10161b;
    --surface: #172127;
    --surface-sunken: #1c2830;
    --border: #2a3941;
    --ink: #e8edef;
    --ink-soft: #aebbc1;
    --ink-faint: #7c8b93;
    --accent: #5fa9c2;
    --accent-soft: #22333a;
    --accent-strong: #8ec5d8;
    --crit: #e2716a;
    --crit-bg: #2e1c1c;
    --alta: #dba05a;
    --alta-bg: #2e2418;
    --media: #5cbdb2;
    --media-bg: #17302c;
    --baja: #93a5b0;
    --baja-bg: #202b31;
    --good: #63be8f;
    --good-bg: #16281f;
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: Arial, "Segoe UI", -apple-system, "Helvetica Neue", sans-serif;
    font-size: 13px;
    line-height: 1.4;
  }
  .page {
    max-width: 980px;
    margin: 0 auto;
    padding: 20px 22px 26px;
  }

  header.report {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 16px;
    border-bottom: 2px solid var(--accent-strong);
    padding-bottom: 10px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .report-title {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 25px;
    font-weight: 700;
    letter-spacing: -0.01em;
    color: var(--accent-strong);
    margin: 0 0 3px;
  }
  .report-sub { color: var(--ink-soft); font-size: 12px; }
  .report-sub a { color: var(--accent); text-decoration: none; border-bottom: 1px solid var(--accent-soft); }
  .report-meta { text-align: right; font-size: 11px; color: var(--ink-faint); }
  .report-meta .date { font-size: 17px; font-weight: 700; color: var(--ink); font-variant-numeric: tabular-nums; }

  .report-block { margin-bottom: 12px; }
  .report-block:last-child { margin-bottom: 0; }
  .report-block-title {
    font-family: Georgia, "Iowan Old Style", "Times New Roman", serif;
    font-size: 18px;
    font-weight: 700;
    color: var(--accent-strong);
    margin: 0 0 3px;
  }
  .report-block-sub { font-size: 11px; color: var(--ink-faint); margin: 0 0 10px; }

  .kpi-row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 9px; margin-bottom: 11px; }
  .kpi {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 7px;
    padding: 9px 10px 8px;
    text-align: center;
  }
  .kpi .num { font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; color: var(--ink); }
  .kpi .label { margin-top: 3px; font-size: 9.5px; color: var(--ink-soft); font-weight: 700; text-transform: uppercase; letter-spacing: 0.02em; }
  .kpi.kpi-alert { background: var(--alta-bg); border-color: var(--alta); }
  .kpi.kpi-alert .num, .kpi.kpi-alert .label { color: var(--alta); }
  .kpi.k-cerrados { border-color: var(--good); }

  .grid-2 { display: grid; grid-template-columns: 1.05fr 1fr; gap: 11px; margin-bottom: 10px; align-items: start; }
  .panel { background: var(--surface); border: 1px solid var(--border); border-radius: 7px; padding: 12px 14px; }
  .panel h3 { margin: 0 0 9px; font-size: 12.5px; font-weight: 700; color: var(--ink); }
  .panel h3 .n { color: var(--ink-faint); font-weight: 500; font-size: 10.5px; }

  .bar-row { display: flex; align-items: center; gap: 9px; margin-bottom: 6px; }
  .bar-row:last-child { margin-bottom: 0; }
  .bar-label { flex: 0 0 50px; font-size: 11px; color: var(--ink-soft); }
  .bar-track { flex: 1; background: var(--surface-sunken); border-radius: 4px; height: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 4px; }
  .bar-val { flex: 0 0 18px; text-align: right; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .estado-abierto .bar-fill { background: var(--crit); }
  .estado-cosmos .bar-fill { background: var(--accent); }
  .estado-pruebas .bar-fill { background: var(--media); }
  .estado-reabierto .bar-fill { background: var(--alta); }
  .estado-primera .bar-fill { background: var(--accent); }
  .sev-critica .bar-fill { background: var(--crit); }
  .sev-alta .bar-fill { background: var(--alta); }

  .stat-row { margin-bottom: 8px; }
  .stat-row:last-child { margin-bottom: 0; }
  .stat-head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; margin-bottom: 3px; }
  .stat-title { font-size: 11px; font-weight: 700; color: var(--ink); }
  .stat-note { font-size: 9.5px; color: var(--ink-faint); text-align: right; }
  .stat-line { display: flex; align-items: center; gap: 9px; }
  .stat-line .bar-track { flex: 1; }
  .stat-line .bar-val { flex: 0 0 18px; text-align: right; font-size: 11.5px; font-weight: 700; font-variant-numeric: tabular-nums; }

  .area-breakdown { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .area-chip { font-size: 9.5px; font-weight: 600; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 2px 7px; }
  .area-chip b { color: var(--ink); font-weight: 800; margin-left: 2px; }

  .oldest-block { margin: 4px 0 8px 2px; padding-left: 9px; border-left: 2px solid var(--border); }
  .oldest-label { display: block; font-size: 9px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-faint); font-weight: 700; margin-bottom: 4px; }
  .oldest-item { display: flex; gap: 7px; font-size: 10px; color: var(--ink-soft); margin-bottom: 3px; line-height: 1.35; }
  .oldest-item:last-child { margin-bottom: 0; }
  .oldest-date { flex: 0 0 54px; color: var(--ink-faint); font-variant-numeric: tabular-nums; font-size: 9.5px; padding-top: 1px; }

  .estado-group { padding: 9px 11px; border-radius: 6px; background: var(--surface-sunken); margin-bottom: 10px; }
  .estado-group:last-child { margin-bottom: 0; }
  .estado-group-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 7px; padding-bottom: 5px; border-bottom: 1px solid var(--border); }
  .estado-group-title { font-size: 10.5px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.03em; }
  .estado-group.group-baufest .estado-group-title { color: var(--accent-strong); }
  .estado-group.group-cosmos .estado-group-title { color: var(--baja); }
  .estado-group-total { font-size: 10.5px; font-weight: 800; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 2px 8px; }

  .panel-note { margin-top: 9px; padding-top: 8px; border-top: 1px solid var(--border); font-size: 9.5px; color: var(--ink-faint); }

  table.moves { width: 100%; border-collapse: collapse; font-size: 10.5px; border: 1px solid var(--border); border-radius: 7px; overflow: hidden; }
  table.moves th { text-align: left; font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); font-weight: 700; padding: 6px 9px; background: var(--surface-sunken); border-bottom: 1px solid var(--border); }
  table.moves td { padding: 5px 9px; border-bottom: 1px solid var(--border); vertical-align: top; }
  table.moves tr:last-child td { border-bottom: none; }
  .id-cell { font-family: "SF Mono", Consolas, monospace; font-size: 10px; font-weight: 700; color: var(--accent-strong); white-space: nowrap; }
  .tag { display: inline-block; padding: 2px 7px; border-radius: 100px; font-size: 9px; font-weight: 700; white-space: nowrap; }
  .tag.mov-nuevo { background: var(--accent-soft); color: var(--accent-strong); }
  .tag.mov-cerrado { background: var(--good-bg); color: var(--good); }
  .tag.mov-retest { background: var(--media-bg); color: var(--media); }
  .tag.mov-reabierto { background: var(--alta-bg); color: var(--alta); }
  .tag.sev-Crítica { background: var(--crit-bg); color: var(--crit); }
  .tag.sev-Alta { background: var(--alta-bg); color: var(--alta); }
  .empty-row { padding: 7px 9px; color: var(--ink-faint); font-size: 10px; font-style: italic; }
  .mov-time { display: block; margin-top: 3px; font-size: 8.7px; color: var(--ink-faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
  .mov-time.hora-stale { color: var(--alta); font-weight: 700; }

  .reason-label { display: block; margin-top: 4px; font-size: 8.5px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); }
  .reason-list { margin: 3px 0 0; padding-left: 13px; font-size: 9.5px; color: var(--ink-soft); line-height: 1.4; }
  .reason-list li { margin-bottom: 2px; }
  .reason-list li:last-child { margin-bottom: 0; }

  footer { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--border); font-size: 9.5px; color: var(--ink-faint); display: flex; justify-content: space-between; flex-wrap: wrap; gap: 8px; }

  @page { size: A4; margin: 12mm 14mm; }
  @media print {
    body { background: var(--surface); }
    .page { padding: 0; max-width: none; }
    .kpi, .panel, table.moves { break-inside: avoid; }
    .grid-2 .panel { break-inside: avoid; }
    .kpi-row { break-inside: avoid; page-break-inside: avoid; }
  }

  @media screen and (max-width: 760px) {
    .kpi-row { grid-template-columns: repeat(2, 1fr); }
    .grid-2 { grid-template-columns: 1fr; }
    header.report { flex-direction: column; align-items: flex-start; }
    .report-meta { text-align: left; }
  }

/* App chrome (toolbar/notice/loading) + the two severidad tokens missing from styles.css. Tokens only, no hardcoded colors. */
.toolbar {
  max-width: 980px;
  margin: 0 auto;
  padding: 10px 22px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  font-size: 12px;
  color: var(--ink-soft);
}
.toolbar .actions { display: flex; gap: 8px; }
.toolbar button {
  font: inherit;
  font-weight: 700;
  font-size: 11.5px;
  padding: 6px 12px;
  border-radius: 6px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--ink);
  cursor: pointer;
}
.toolbar button:hover { border-color: var(--accent); color: var(--accent-strong); }
.toolbar button:disabled { opacity: 0.55; cursor: default; }
.toolbar button[hidden] { display: none; }

#notice {
  max-width: 980px;
  margin: 10px auto 0;
  padding: 9px 14px;
  border-radius: 6px;
  background: var(--alta-bg);
  color: var(--alta);
  border: 1px solid var(--alta);
  font-size: 12px;
}
#notice[hidden] { display: none; }

.loading-note { padding: 40px 0; text-align: center; color: var(--ink-faint); font-size: 12.5px; }

@media print {
  #toolbar, #notice { display: none; }
}

.sev-media .bar-fill { background: var(--media); }
.sev-baja .bar-fill { background: var(--baja); }
.tag.sev-Media { background: var(--media-bg); color: var(--media); }
.tag.sev-Baja { background: var(--baja-bg); color: var(--baja); }

/* --- Incidencias & Mejoras Go Live additions --- */
.kpi-row.six { grid-template-columns: repeat(6, 1fr); }
@media screen and (max-width: 760px) {
  .kpi-row.six, .kpi-row.four { grid-template-columns: repeat(2, 1fr); }
}

.dl-note { margin: -4px 0 11px; font-size: 10.5px; color: var(--ink-faint); }

.sev-chips { display: flex; gap: 6px; margin: 4px 0 2px 59px; font-size: 9.5px; font-weight: 700; color: var(--ink-soft); }

.id-cell a { color: inherit; text-decoration: none; }

.tag.mov-revisado { background: var(--accent-soft); color: var(--accent-strong); }

.tag.gl-bloq { background: var(--crit-bg); color: var(--crit); }
.tag.gl-nobloq { background: var(--baja-bg); color: var(--baja); }
.tag.gl-dl { background: var(--media-bg); color: var(--media); }
.tag.gl-none { background: var(--baja-bg); color: var(--baja); }

/* --- Handover inventory view --- */
.kpi.k-main { border-color: var(--accent); background: var(--accent-soft); }
.kpi.k-main .num, .kpi.k-main .label { color: var(--accent-strong); }
.kpi.k-muted .num { color: var(--ink-soft); }

.lead-note { margin: 0 0 11px; padding: 9px 12px; border-left: 3px solid var(--accent); background: var(--surface); border-radius: 0 6px 6px 0; font-size: 12px; color: var(--ink); }

.bar-track.stack { display: flex; }
.bar-track.stack .seg { height: 100%; }
.seg-bloq { background: var(--crit); }
.seg-nobloq { background: var(--baja); }
.seg-none { background: var(--alta); }
.legend { display: flex; gap: 12px; margin: -3px 0 9px; font-size: 9.5px; color: var(--ink-soft); }
.legend .sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; vertical-align: -1px; }
.bar-row.cmp { margin-bottom: 7px; }
.bar-row.cmp .bar-label { flex: 0 0 132px; font-size: 10.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.bar-row.cmp .bar-val { flex-basis: 26px; }
.bar-row.cmp .bar-sub { flex: 0 0 46px; font-size: 9.5px; font-weight: 700; color: var(--crit); text-align: right; white-space: nowrap; }
.panel h3.sub-h { margin-top: 12px; padding-top: 9px; border-top: 1px solid var(--border); }
.stat-line .bar-val { flex-basis: 24px; }

table.matrix { width: 100%; border-collapse: collapse; font-size: 11.5px; font-variant-numeric: tabular-nums; }
table.matrix th { font-size: 9px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-faint); font-weight: 700; padding: 5px 6px; text-align: center; border-bottom: 1px solid var(--border); }
table.matrix td { padding: 8px 6px; text-align: center; border-bottom: 1px solid var(--border); font-weight: 700; color: var(--ink); }
table.matrix .row-h { text-align: left; }
table.matrix td.zero { color: var(--ink-faint); font-weight: 400; }
table.matrix td.hot { background: var(--crit-bg); color: var(--crit); }
table.matrix td.warm { background: var(--alta-bg); color: var(--alta); }
table.matrix td.tot { background: var(--surface-sunken); }
table.matrix tr.total td { background: var(--surface-sunken); border-bottom: none; }

.inv-filters { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; margin: 0 0 12px; padding: 8px 10px; background: var(--surface); border: 1px solid var(--border); border-radius: 7px; font-size: 11px; color: var(--ink-soft); }
.inv-filters label { display: flex; align-items: center; gap: 5px; font-weight: 700; }
.inv-filters label.grow { flex: 1; min-width: 160px; }
.inv-filters select, .inv-filters input { font: inherit; font-weight: 400; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 4px 6px; }
.inv-filters input { flex: 1; min-width: 0; }
#inv-shown { margin-left: auto; font-weight: 700; color: var(--ink); }

.inv-section { margin-bottom: 14px; }
.inv-title { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin: 0 0 6px; font-size: 13px; font-weight: 800; color: var(--ink); }
.inv-count { font-size: 10.5px; font-weight: 800; background: var(--surface); border: 1px solid var(--border); border-radius: 100px; padding: 1px 8px; }
.inv-nota { font-size: 10px; font-weight: 400; color: var(--ink-faint); }
.sec-bloq .inv-title { color: var(--crit); }
.sec-retest .inv-title, .sec-dl .inv-title { color: var(--ink-soft); }
table.moves.inv { background: var(--surface); }
table.moves .rel { display: block; margin-top: 2px; font-size: 9px; color: var(--ink-faint); }
.tag.gl-stack { display: block; width: max-content; margin-top: 3px; }
td.et { font-size: 10px; color: var(--ink-soft); }
td.et-reab { color: var(--alta); font-weight: 700; }
td.num-cell { text-align: right; font-variant-numeric: tabular-nums; font-weight: 700; }
.resumen-hoy { margin: 0 0 8px; font-size: 11.5px; color: var(--ink-soft); }
@media print { .inv-filters { display: none; } }

/* --- PDF options panel --- */
.pdf-panel { max-width: 980px; margin: 0 auto; padding: 12px 22px 14px; background: var(--surface); border-bottom: 1px solid var(--border); font-size: 12px; color: var(--ink); }
.pdf-panel .pdf-modes { display: flex; flex-wrap: wrap; gap: 8px 22px; margin-bottom: 10px; }
.pdf-panel label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
.pdf-panel .pdf-hint { color: var(--ink-faint); font-size: 11px; }
.pdf-areas { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 6px 14px; padding: 9px 11px; border: 1px solid var(--border); border-radius: 6px; background: var(--surface-sunken); margin-bottom: 10px; }
.pdf-areas.disabled { opacity: 0.5; }
.pdf-areas .area-n { color: var(--ink-faint); font-size: 10.5px; }
.pdf-panel .pdf-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.pdf-panel .pdf-row .links button { font: inherit; font-size: 11px; background: none; border: none; color: var(--accent); cursor: pointer; padding: 0; }
.pdf-panel .pdf-actions { margin-left: auto; display: flex; gap: 8px; }
.pdf-panel .pdf-actions button { font: inherit; font-weight: 700; font-size: 11.5px; padding: 6px 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; }
.pdf-panel .pdf-actions button.primary { background: var(--accent-strong); border-color: var(--accent-strong); color: var(--surface); }
.pdf-panel .pdf-actions button:disabled { opacity: 0.5; cursor: default; }

.eyebrow { margin: 0 0 4px; font-size: 10.5px; font-weight: 800; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }

/* --- PDF panel: review options + message --- */
.pdf-extra { display: flex; flex-wrap: wrap; gap: 8px 18px; margin: 0 0 10px; font-size: 11.5px; }
.pdf-extra input, .pdf-extra select { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--border); border-radius: 5px; padding: 3px 6px; }
.pdf-msg { margin: 0 0 10px; }
.pdf-msg .pdf-msg-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; font-size: 11px; font-weight: 700; color: var(--ink-soft); }
.pdf-msg textarea { width: 100%; min-height: 150px; font: inherit; font-size: 11.5px; line-height: 1.45; color: var(--ink); background: var(--surface-sunken); border: 1px solid var(--border); border-radius: 6px; padding: 8px 10px; resize: vertical; }
.pdf-msg button { font: inherit; font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 5px; border: 1px solid var(--border); background: var(--surface); color: var(--ink); cursor: pointer; }
.kpi-row.four { grid-template-columns: repeat(4, 1fr); }
.tag.reab-tag { display: block; width: max-content; margin-top: 3px; background: var(--alta-bg); color: var(--alta); }
@media screen and (max-width: 760px) {
  table.moves.inv th:nth-child(3), table.moves.inv td:nth-child(3) { display: none; }
}

[hidden] { display: none !important; }

tr.cont-row td { padding: 4px 9px 6px !important; border: none !important; background: var(--surface) !important; font-size: 13px; font-weight: 800; color: var(--ink-soft); }

/* PDF render always uses the desktop layout, whatever the viewer's screen width (see app.js pdfBlobFrom). */
@media screen and (max-width: 760px) {
  .pdf-desktop .kpi-row { grid-template-columns: repeat(5, 1fr); }
  .pdf-desktop .kpi-row.six { grid-template-columns: repeat(6, 1fr); }
  .pdf-desktop .kpi-row.four { grid-template-columns: repeat(4, 1fr); }
  .pdf-desktop .grid-2 { grid-template-columns: 1.05fr 1fr; }
  .pdf-desktop header.report { flex-direction: row; align-items: flex-end; }
  .pdf-desktop .report-meta { text-align: right; }

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.3/html2pdf.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
/* IncidenciasEngine — pure computation of the Incidencias & Mejoras Go Live report model. IIFE, ES2019. */
(function (global) {
  "use strict";

  var MESES_CORTOS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
  var MESES_LARGOS = ["enero", "febrero", "marzo", "abril", "mayo", "junio", "julio", "agosto",
    "septiembre", "octubre", "noviembre", "diciembre"];
  var STRIP_TAGS = { "BAUFEST": true };
  var CODE_RE = /^(H|D|UAT-E2E|PECMO\d*)-?\d+/;
  var SEV_ORDER = ["Crítica", "Alta", "Media", "Baja"];
  var SEV_ABBR = { "Crítica": "C", "Alta": "A", "Media": "M", "Baja": "B" };

  // ---- Lima time (UTC-5, fixed, no DST) — same helpers as the reference (_ref_engine_defectos.js) ----
  function ticksToMs(s) {
    return Number(String(s).slice(0, -4));
  }

  function limaDate(ms) {
    return new Date(ms - 5 * 3600e3).toISOString().slice(0, 10);
  }

  function limaParts(ms) {
    var d = new Date(ms - 5 * 3600e3);
    return { h: d.getUTCHours(), m: d.getUTCMinutes() };
  }

  function fmtHora(ms) {
    var p = limaParts(ms);
    var ampm = p.h < 12 ? "am" : "pm";
    var h12 = p.h % 12;
    if (h12 === 0) h12 = 12;
    var mm = p.m < 10 ? "0" + p.m : String(p.m);
    return h12 + ":" + mm + " " + ampm;
  }

  function parseYMD(s) {
    var parts = String(s).split("-");
    return { y: Number(parts[0]), m: Number(parts[1]), d: Number(parts[2]) };
  }

  function fmtCorta(ymd) {
    var p = parseYMD(ymd);
    return p.d + " " + MESES_CORTOS[p.m - 1];
  }

  function fmtMedia(ymd) {
    var p = parseYMD(ymd);
    return p.d + " " + MESES_CORTOS[p.m - 1] + " " + p.y;
  }

  function fmtLarga(ymd) {
    var p = parseYMD(ymd);
    return p.d + " de " + MESES_LARGOS[p.m - 1] + ", " + p.y;
  }

  function diasEntre(a, b) {
    var pa = parseYMD(a), pb = parseYMD(b);
    var ma = Date.UTC(pa.y, pa.m - 1, pa.d);
    var mb = Date.UTC(pb.y, pb.m - 1, pb.d);
    return Math.round((mb - ma) / 86400000);
  }

  // ---- title cleanup ----
  function collapseSpaces(s) {
    return String(s).replace(/\s+/g, " ").trim();
  }

  function isAllCaps(s) {
    return /[A-ZÁÉÍÓÚÑÜ]/.test(s) && s === s.toUpperCase() && s !== s.toLowerCase();
  }

  function sentenceCase(s) {
    if (!s) return s;
    return s.charAt(0).toUpperCase() + s.slice(1).toLowerCase();
  }

  function codeOf(name, id) {
    var m = String(name).match(/\[([^\[\]]+)\]/);
    if (m) {
      var content = m[1].trim();
      if (CODE_RE.test(content)) return { code: content, bracketContent: content };
    }
    var idStr = String(id);
    var last5 = idStr.length > 5 ? idStr.slice(-5) : idStr;
    return { code: "#" + last5, bracketContent: null };
  }

  function cleanTitle(name, codeBracketContent, sinCortar) {
    // [BLOQUEANTE]/[NO BLOQUEANTE] tags anywhere repeat the Estado Go Live column — drop them
    var s = collapseSpaces(String(name).replace(/\[\s*(NO\s+)?BLOQUEANTE\s*\]\s*,?\s*/gi, ""));
    // strip leading [TAG] groups: BAUFEST, and the code token itself (already shown in the ID column)
    while (true) {
      var m = s.match(/^\[([^\[\]]+)\]/);
      if (!m) break;
      var content = m[1].trim();
      var upper = content.toUpperCase();
      var isCodeToken = codeBracketContent != null && content === codeBracketContent;
      if (!STRIP_TAGS[upper] && !isCodeToken) break;
      s = s.slice(m[0].length).replace(/^[\s,]+/, "");
    }
    var prefix = null, rest = s;
    var m2 = s.match(/^\[([^\[\]]+)\]/);
    if (m2) {
      var x = m2[1].trim();
      if (isAllCaps(x)) x = sentenceCase(x);
      prefix = x;
      rest = s.slice(m2[0].length).replace(/^\s+/, "");
    }
    var out;
    if (prefix !== null) {
      var hasColon = rest.slice(0, 40).indexOf(":") !== -1;
      out = hasColon ? (prefix + ". " + rest) : (prefix + ": " + rest);
    } else {
      out = rest;
    }
    out = collapseSpaces(out);
    if (out.length) out = out.charAt(0).toUpperCase() + out.slice(1);
    if (out.charAt(out.length - 1) === ".") out = out.slice(0, -1);
    if (!sinCortar && out.length > 110) {
      var cut = out.slice(0, 110);
      var idx = cut.lastIndexOf(" ");
      if (idx > -1) cut = cut.slice(0, idx);
      cut = cut.replace(/[,;:—\-\s]+$/, "");
      out = cut + "…";
    }
    return out;
  }

  // ---- column value helpers ----
  function cv(item, col) {
    var v = item.column_values && item.column_values[col];
    return v === undefined ? null : v;
  }
  function glRawOf(it) { return cv(it, "color_mm654b11"); }
  function areaOf(it) { return cv(it, "dropdown_mm38x45a"); }
  function sevOf(it) { return cv(it, "color_mm08qtw9"); }
  function reporteOf(it) { return cv(it, "date_mm0dgr9k"); }
  function revisionOf(it) { return cv(it, "date_mm151q1k"); }
  function retestOf(it) { return cv(it, "date_mm0dfxgk"); }
  function cierreOf(it) { return cv(it, "date_mm0d57hz"); }
  function reaperturaOf(it) { return cv(it, "date_mm1q65r7"); }
  function etapaOf(it) { return cv(it, "color_mm73ye9b"); }

  function relOf(it) { return cv(it, "text_mm6w60e0"); }
  function tipoOf(it) {
    var g = it.group || {};
    if (g.id === "group_mm6618d8" || /mejora/i.test(g.title || "")) return "Mejora";
    return "Incidencia";
  }

  function isDataLake(it) { return glRawOf(it) === "Data Lake"; }
  function isBloqueante(it) { return glRawOf(it) === "Bloqueante"; }
  function glDisplay(raw) {
    if (raw == null) return "Sin clasificar";
    if (raw === "No Bloquenate") return "No bloqueante"; // sic — typo in monday.com
    return raw;
  }
  function glClass(raw) {
    if (raw === "Bloqueante") return "gl-bloq";
    if (raw === "Data Lake") return "gl-dl";
    if (raw == null) return "gl-none";
    return "gl-nobloq"; // "No bloqueante" / "No Bloquenate"
  }

  // ---- stage: the board's "Etapa" status column (Reportado / En revisión / Ejecutar pruebas / Cerrado) ----
  var ETAPAS = ["Reportado", "En revisión", "Ejecutar pruebas", "Cerrado"];
  function stageOf(it) {
    var et = etapaOf(it);
    return ETAPAS.indexOf(et) !== -1 ? et : "Sin etapa";
  }
  // Reopened marker (not a stage): Reapertura date set after the last retest release.
  function reabiertoOf(it) {
    var rea = reaperturaOf(it), ret = retestOf(it);
    return rea != null && (ret == null || rea > ret);
  }
  function isOpen(stage) { return stage !== "Cerrado"; }
  function responsableOf(stage) {
    if (stage === "Reportado" || stage === "En revisión" || stage === "Sin etapa") return "Desarrollo";
    if (stage === "Ejecutar pruebas") return "Cosmos";
    return null;
  }

  // ---- activity (only used to get the HOUR of today's set-events) ----
  function parseActivity(activityObj) {
    var byPulse = {};
    if (!activityObj || !activityObj.data) return byPulse;
    var list = [];
    for (var i = 0; i < activityObj.data.length; i++) {
      var e = activityObj.data[i];
      var d;
      try { d = JSON.parse(e.data); } catch (err) { continue; }
      list.push({ ms: ticksToMs(e.created_at), event: e.event, d: d });
    }
    list.sort(function (a, b) { return a.ms - b.ms; });
    for (var j = 0; j < list.length; j++) {
      var ev = list[j];
      var pid = ev.d && ev.d.pulse_id;
      if (pid === undefined || pid === null) continue;
      pid = Number(pid);
      if (!byPulse[pid]) byPulse[pid] = [];
      byPulse[pid].push(ev);
    }
    return byPulse;
  }

  function lastSetEventHora(evs, colId, hoy) {
    var found = null;
    if (!evs) return null;
    for (var i = 0; i < evs.length; i++) {
      var ev = evs[i];
      if (ev.event !== "update_column_value" || ev.d.column_id !== colId) continue;
      var val = ev.d.value;
      if (val && val.date === hoy) found = ev;
    }
    if (!found) return null;
    var ms = found.d.value.changed_at ? Date.parse(found.d.value.changed_at) : found.ms;
    return fmtHora(ms);
  }

  // ---- helpers for the handover (inventory) view ----
  var GL_ORDER = ["bloq", "nobloq", "none"];
  var GL_LABEL = { bloq: "Bloqueante", nobloq: "No bloqueante", none: "Sin clasificar" };
  var STAGE_ORDER = ["Reportado", "En revisión", "Sin etapa", "Ejecutar pruebas"];
  var AGE_BUCKETS = [
    { label: "0 a 7 días", min: 0, max: 7 },
    { label: "8 a 30 días", min: 8, max: 30 },
    { label: "31 a 60 días", min: 31, max: 60 },
    { label: "Más de 60 días", min: 61, max: Infinity }
  ];

  function glKey(raw) {
    if (raw === "Bloqueante") return "bloq";
    if (raw === "Data Lake") return "dl";
    if (raw == null) return "none";
    return "nobloq";
  }

  function pct1(x) { return Math.round(x * 1000) / 10; }

  function split(arr) {
    var r = { n: arr.length, bloq: 0, nobloq: 0, none: 0 };
    arr.forEach(function (e) { r[e.glk === "bloq" ? "bloq" : (e.glk === "none" ? "none" : "nobloq")]++; });
    return r;
  }

  function addWidths(rows) {
    var max = rows.reduce(function (m, r) { return Math.max(m, r.n); }, 0);
    rows.forEach(function (r) {
      r.wB = max > 0 ? pct1(r.bloq / max) : 0;
      r.wN = max > 0 ? pct1(r.nobloq / max) : 0;
      r.wX = max > 0 ? pct1(r.none / max) : 0;
    });
    return rows;
  }

  function sevRank(s) {
    var i = SEV_ORDER.indexOf(s);
    return i === -1 ? SEV_ORDER.length : i;
  }

  function invRow(e, hoy) {
    var it = e.it;
    var ci = codeOf(it.name, it.id);
    var rep = reporteOf(it);
    return {
      code: ci.code, url: it.url, desc: cleanTitle(it.name, ci.bracketContent),
      descCompleta: cleanTitle(it.name, ci.bracketContent, true),
      rel: relOf(it) ? collapseSpaces(relOf(it)) : null,
      tipo: e.tipo, area: e.area || "Sin área", areas: areaTokens(e.area), sev: e.sev || "—", etapa: e.stage,
      reab: e.reab,
      dias: rep != null ? diasEntre(rep, hoy) : null,
      gl: glDisplay(e.glRaw), glClase: glClass(e.glRaw)
    };
  }

  function sortInv(rows) {
    rows.sort(function (a, b) {
      var s = sevRank(a.sev) - sevRank(b.sev);
      if (s) return s;
      var da = a.dias == null ? -1 : a.dias, db = b.dias == null ? -1 : b.dias;
      if (da !== db) return db - da;
      return a.code < b.code ? -1 : (a.code > b.code ? 1 : 0);
    });
    return rows;
  }

  function uniqSorted(arr) {
    var seen = {};
    arr.forEach(function (v) { seen[v] = true; });
    return Object.keys(seen).sort(function (a, b) { return a.localeCompare(b, "es"); });
  }

  // Área is a multi-value dropdown ("DOCUMENTACION, TI") and some labels combine two areas
  // ("DOCUMENTACION / OPERACIONES"): a ticket belongs to every area it names.
  function areaTokens(area) {
    if (area == null || !String(area).trim()) return ["Sin área"];
    return String(area).split(/\s*[,\/]\s*/).filter(function (t) { return t; });
  }

  function listaAreas(areas) {
    if (areas.length === 1) return areas[0];
    return areas.slice(0, -1).join(", ") + " y " + areas[areas.length - 1];
  }

  // opts.areas (optional): keep only tickets tagged with at least one of these areas (validation PDF).
  function compute(raw, opts) {
    opts = opts || {};
    var now = raw.now;
    var hoy = limaDate(now);
    var areasSel = opts.areas && opts.areas.length ? opts.areas.slice() : null;
    var items = (raw.items || []).filter(function (it) {
      if (!areasSel) return true;
      return areaTokens(areaOf(it)).some(function (t) { return areasSel.indexOf(t) !== -1; });
    });
    var boardName = raw.boardName || "";
    var actToday = parseActivity(raw.activityToday);

    var enriched = items.map(function (it) {
      var stage = stageOf(it);
      var glRaw = glRawOf(it);
      var rep = reporteOf(it);
      return {
        it: it,
        stage: stage,
        open: isOpen(stage),
        dl: isDataLake(it),
        bloq: isBloqueante(it),
        glRaw: glRaw,
        glk: glKey(glRaw),
        area: areaOf(it),
        sev: sevOf(it),
        tipo: tipoOf(it),
        reab: reabiertoOf(it),
        dias: rep != null ? diasEntre(rep, hoy) : null
      };
    });

    // "Por atender" = open, not Data Lake, still on the vendor's side (Etapa Reportado / En revisión / empty).
    // "Ejecutar pruebas" is on Cosmos' side: listed apart, not added to the total.
    var openNonDL = enriched.filter(function (e) { return e.open && !e.dl; });
    var porAtender = openNonDL.filter(function (e) { return responsableOf(e.stage) === "Desarrollo"; });
    var enRetest = openNonDL.filter(function (e) { return e.stage === "Ejecutar pruebas"; });
    var dlOpen = enriched.filter(function (e) { return e.open && e.dl; });

    var tot = split(porAtender);
    var criticos = porAtender.filter(function (e) { return e.sev === "Crítica"; }).length;
    var kpis = {
      porAtender: tot.n, bloqueantes: tot.bloq, noBloqueantes: tot.nobloq, sinClasificar: tot.none,
      criticos: criticos, retest: enRetest.length, dataLake: dlOpen.length
    };

    // ---- Matriz de prioridad: Estado Go Live x Severidad (por atender) ----
    var sevCols = SEV_ORDER.slice();
    if (porAtender.some(function (e) { return sevRank(e.sev) === SEV_ORDER.length; })) sevCols.push("Sin severidad");
    function colOf(e) { return sevRank(e.sev) === SEV_ORDER.length ? "Sin severidad" : e.sev; }
    var matrizFilas = GL_ORDER.filter(function (k) { return k !== "none" || tot.none > 0; }).map(function (k) {
      var arr = porAtender.filter(function (e) { return e.glk === k; });
      return {
        key: k, gl: GL_LABEL[k], glClase: k === "bloq" ? "gl-bloq" : (k === "none" ? "gl-none" : "gl-nobloq"),
        cells: sevCols.map(function (c) { return arr.filter(function (e) { return colOf(e) === c; }).length; }),
        total: arr.length
      };
    });
    var matriz = {
      cols: sevCols,
      filas: matrizFilas,
      totales: sevCols.map(function (c) { return porAtender.filter(function (e) { return colOf(e) === c; }).length; }),
      total: tot.n
    };

    // ---- En qué etapa están (stage x Estado Go Live) ----
    var etapaFilas = addWidths(STAGE_ORDER.map(function (st) {
      var r = split(openNonDL.filter(function (e) { return e.stage === st; }));
      r.etapa = st;
      r.label = st === "Reportado" ? "Reportado (sin revisar)" : (st === "Sin etapa" ? "Sin etapa en monday" : st);
      return r;
    }));
    var etapas = {
      baufest: etapaFilas.slice(0, 3).filter(function (r) { return r.etapa !== "Sin etapa" || r.n > 0; }),
      retest: etapaFilas[3],
      reabiertos: porAtender.filter(function (e) { return e.reab; }).length
    };

    // ---- Por área (por atender) ----
    var areaMap = {};
    porAtender.forEach(function (e) {
      var a = e.area || "Sin área";
      (areaMap[a] = areaMap[a] || []).push(e);
    });
    var areas = addWidths(Object.keys(areaMap).map(function (a) {
      var r = split(areaMap[a]);
      r.area = a;
      return r;
    }));
    areas.sort(function (a, b) {
      if (b.n !== a.n) return b.n - a.n;
      if (b.bloq !== a.bloq) return b.bloq - a.bloq;
      return a.area.localeCompare(b.area, "es");
    });

    // ---- Antigüedad desde Fecha de reporte (por atender) ----
    var antiguedad = AGE_BUCKETS.map(function (bk) {
      var r = split(porAtender.filter(function (e) { return e.dias != null && e.dias >= bk.min && e.dias <= bk.max; }));
      r.label = bk.label;
      return r;
    });
    var sinFecha = porAtender.filter(function (e) { return e.dias == null; });
    if (sinFecha.length) {
      var rs = split(sinFecha);
      rs.label = "Sin fecha de reporte";
      antiguedad.push(rs);
    }
    addWidths(antiguedad);

    // ---- Por tipo (grupos del tablero) ----
    var tipos = addWidths(["Incidencia", "Mejora"].map(function (t) {
      var r = split(porAtender.filter(function (e) { return e.tipo === t; }));
      r.label = t === "Incidencia" ? "Incidencias" : "Mejoras";
      return r;
    }));

    // ---- Inventario completo ----
    function rowsOf(arr) { return sortInv(arr.map(function (e) { return invRow(e, hoy); })); }
    var inventario = [
      { key: "bloq", titulo: "Bloqueantes", nota: "Impiden el Go Live: atender primero.",
        filas: rowsOf(porAtender.filter(function (e) { return e.glk === "bloq"; })) },
      { key: "nobloq", titulo: "No bloqueantes", nota: "No detienen el Go Live.",
        filas: rowsOf(porAtender.filter(function (e) { return e.glk === "nobloq"; })) }
    ];
    if (tot.none > 0) {
      inventario.push({ key: "none", titulo: "Sin clasificar", nota: "Falta definir el Estado Go Live.",
        filas: rowsOf(porAtender.filter(function (e) { return e.glk === "none"; })) });
    }
    if (enRetest.length) {
      inventario.push({ key: "retest", titulo: "Ejecutar pruebas (Cosmos)",
        nota: "Fuera del total por atender: vuelven a desarrollo si las pruebas fallan.", conGl: true,
        filas: rowsOf(enRetest) });
    }
    if (dlOpen.length) {
      inventario.push({ key: "dl", titulo: "Data Lake", nota: "Frente aparte, fuera de los indicadores de Go Live.",
        conGl: true, filas: rowsOf(dlOpen) });
    }
    var todas = [];
    inventario.forEach(function (s) { todas = todas.concat(s.filas); });
    var filtros = {
      areas: uniqSorted([].concat.apply([], todas.map(function (r) { return r.areas; }))),
      etapas: STAGE_ORDER.filter(function (st) { return todas.some(function (r) { return r.etapa === st; }); }),
      tipos: uniqSorted(todas.map(function (r) { return r.tipo; }))
    };

    // ---- Resumen (lead paragraph) ----
    var mas30 = porAtender.filter(function (e) { return e.dias != null && e.dias > 30; }).length;
    var partes = [tot.bloq + (tot.bloq === 1 ? " bloqueante" : " bloqueantes") + " (" + porAtender.filter(function (e) {
      return e.glk === "bloq" && e.sev === "Crítica"; }).length + " críticos)"];
    partes.push(tot.nobloq + (tot.nobloq === 1 ? " no bloqueante" : " no bloqueantes"));
    if (tot.none) partes.push(tot.none + " sin clasificar");
    var ultima = partes.pop();
    var resumen = [];
    var sujeto = areasSel ? (listaAreas(areasSel) + (areasSel.length === 1 ? " tiene " : " tienen ")) : "Hay ";
    resumen.push(sujeto + tot.n + (tot.n === 1 ? " ticket" : " tickets") + " por atender: " +
      (partes.length ? partes.join(", ") + " y " : "") + ultima + ".");
    if (tot.n > 0) resumen.push(Math.round((mas30 / tot.n) * 100) + "% lleva más de 30 días esperando solución.");
    if (etapas.reabiertos) resumen.push(etapas.reabiertos + (etapas.reabiertos === 1 ? " fue reabierto." : " fueron reabiertos."));
    if (enRetest.length) resumen.push("Otros " + enRetest.length + " están en «Ejecutar pruebas» con Cosmos y vuelven a desarrollo si las pruebas fallan.");
    if (dlOpen.length) resumen.push("Data Lake suma " + dlOpen.length + " aparte.");

    // ---- Movements today (ALL items incl. Data Lake) ----
    var movRaw = [];
    var TYPE_ORDER = { cerrado: 0, reabierto: 1, retest: 2, revisado: 3, nuevo: 4 };
    enriched.forEach(function (e) {
      var it = e.it;
      var cie = cierreOf(it), rea = reaperturaOf(it), ret = retestOf(it), rev = revisionOf(it);
      var tipo = null, colId = null;
      if (cie === hoy) { tipo = "cerrado"; colId = "date_mm0d57hz"; }
      else if (rea === hoy) { tipo = "reabierto"; colId = "date_mm1q65r7"; }
      else if (ret === hoy) { tipo = "retest"; colId = "date_mm0dfxgk"; }
      else if (rev === hoy) { tipo = "revisado"; colId = "date_mm151q1k"; }
      else if (limaDate(Date.parse(it.created_at)) === hoy) { tipo = "nuevo"; }

  // ---------------------------------------------------------------- data helpers

    ["datosActualizados", "fecha de actualización de los datos"], ["fechaLimite", "fecha límite de respuesta"],
    ["gerenciaResponsable", "gerencia responsable"], ["destinatario.correo", "correo del destinatario"]

  function valor(cfg, ruta) {
    return ruta.split(".").reduce(function (v, k) { return v && typeof v === "object" ? v[k] : null; }, cfg);
  }

  function pendientes(cfg) {
    var faltan = REQUERIDOS.filter(function (r) { return !valor(cfg, r[0]); }).map(function (r) { return r[1]; });
    (cfg.tickets || []).forEach(function (t, i) {

      if (!t.id) faltan.push("ID del ticket " + ref);
      if (!t.descripcion) faltan.push("descripción del ticket " + ref);
      if (!t.severidad) faltan.push("severidad del ticket " + ref);

  function agrupar(tickets) {

        if (s) return s;
        var ea = a.espera == null ? -1 : a.espera, eb = b.espera == null ? -1 : b.espera;
        if (ea !== eb) return eb - ea;
        return String(a.id) < String(b.id) ? -1 : (String(a.id) > String(b.id) ? 1 : 0);
      });
    }
    var pruebas = tickets.filter(function (t) { return t.estado === ESTADO_PRUEBAS; });
    var resto = tickets.filter(function (t) { return t.estado !== ESTADO_PRUEBAS; });
    var bloq = resto.filter(function (t) { return t.clasificacion === "Bloqueante"; });
    var grupos = [
      ["Bloqueantes críticos", "Clasificación Go Live: Bloqueante. Severidad: Crítica.", bloq.filter(function (t) { return t.severidad === "Crítica"; }), false],
      ["Otros bloqueantes", "Clasificación Go Live: Bloqueante.", bloq.filter(function (t) { return t.severidad !== "Crítica"; }), false],
      ["No bloqueantes", "Clasificación Go Live: No bloqueante.", resto.filter(function (t) { return t.clasificacion === "No bloqueante"; }), false],
      ["Sin clasificación Go Live", "Estos tickets aún no tienen clasificación Go Live asignada.",
        resto.filter(function (t) { return ["Bloqueante", "No bloqueante", "Data Lake"].indexOf(t.clasificacion) === -1; }), false],
      ["Data Lake", "Clasificación: Data Lake.", resto.filter(function (t) { return t.clasificacion === "Data Lake"; }), false],
      ["En pruebas", "Tickets en la etapa Ejecutar pruebas. Confirme igualmente su clasificación.", pruebas, true]
    ];
    return grupos.filter(function (g) { return g[2].length; }).map(function (g) {

  }

  function resumen(tickets) {
    var n = tickets.length;
    var bloq = tickets.filter(function (t) { return t.clasificacion === "Bloqueante"; });
    var crit = bloq.filter(function (t) { return t.severidad === "Crítica"; });
    var nob = tickets.filter(function (t) { return t.clasificacion === "No bloqueante"; });
    var dl = tickets.filter(function (t) { return t.clasificacion === "Data Lake"; });
    var sin = tickets.filter(function (t) { return ["Bloqueante", "No bloqueante", "Data Lake"].indexOf(t.clasificacion) === -1; });
    var pruebas = tickets.filter(function (t) { return t.estado === ESTADO_PRUEBAS; });
    var partes = [];
    if (bloq.length) {
      var b = bloq.length, c = crit.length;
      if (c === 0) partes.push(plural(b, "bloqueante", "bloqueantes"));
      else if (b === 1) partes.push("1 bloqueante crítico");
      else if (c === b) partes.push(b + " bloqueantes, todos críticos");
      else partes.push(b + " bloqueantes, de los cuales " + (c === 1 ? "1 es crítico" : c + " son críticos"));

    if (nob.length) partes.push(plural(nob.length, "no bloqueante", "no bloqueantes"));
    if (sin.length) partes.push(sin.length + " sin clasificación Go Live");
    if (dl.length) partes.push(dl.length + " de Data Lake");

    if (pruebas.length) {

        var std = doc.createElement("td");
        std.colSpan = cols || 1;
        std.style.cssText = "height:" + gap + "px;padding:0;border:none;background:#fff";
        sp.appendChild(std);
        var extra = inHead ? [] : contRows(node);
        if (node.tagName === "TBODY") {
          var tb = doc.createElement("tbody");
          tb.appendChild(sp);
          extra.forEach(function (r) { tb.appendChild(r); });
          node.parentNode.insertBefore(tb, node);
        } else {
          node.parentNode.insertBefore(sp, node);
          extra.forEach(function (r) { node.parentNode.insertBefore(r, node); });
        }
      } else {
        var div = doc.createElement("div");
        div.style.height = gap + "px";
        node.parentNode.insertBefore(div, node);
      }
    }
  }

  /* Running footer on every page: document label + "Página X de Y" (replaces the in-flow footer). */
  function addPageFooter(pdf, text) {
    var n = pdf.getNumberOfPages();
    for (var i = 1; i <= n; i++) {
      pdf.setPage(i);
      pdf.setFont("helvetica", "normal");
      pdf.setFontSize(8);
      pdf.setTextColor(85, 101, 110);
      pdf.text(pdf.splitTextToSize(text, 150)[0], PDF_MARGIN.left, 291);
      pdf.text("Página " + i + " de " + n, 210 - PDF_MARGIN.left, 291, { align: "right" });
    }
  }

  function escHtml(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  function noticeForPdfError(e) {
    var code = e && e.code;
    if (code === "declined") return null;
    if (code === "rate_limited") return NOTICE.PDF_BUSY;
    if (code === "rejected_extension" || code === "extension_not_enabled" || code === "unavailable" ||
        code === "not_granted" || code === "capability_disabled" || code === "capability_removed") {
      return NOTICE.PDF_UNAVAILABLE;
    }
    return NOTICE.PDF_OTHER;
  }

  /* Rasterize one report page (the on-screen .page or a detached one) into a PDF blob. */
  async function pdfBlobFrom(pageNode, renderWidth, footerText) {
    var PDF_RENDER_WIDTH = renderWidth || 900;
    var wrapper = document.createElement("div");
    wrapper.style.position = "fixed";
    wrapper.style.left = "-10000px";
    wrapper.style.top = "0";
    wrapper.style.width = PDF_RENDER_WIDTH + "px";
    var clone = pageNode.cloneNode(true);
    clone.classList.add("pdf-desktop");
    /* The PDF always carries the full inventory, whatever filters are active on screen. */
    var fbar = clone.querySelector("#inv-filters");
    if (fbar) fbar.parentNode.removeChild(fbar);
    Array.prototype.forEach.call(clone.querySelectorAll("tr[data-q], .inv-section"), function (n) { n.hidden = false; });
    var emptyNote = clone.querySelector("#inv-empty");
    if (emptyNote) emptyNote.hidden = true;
    Array.prototype.forEach.call(clone.querySelectorAll(".inv-count"), function (c) { c.textContent = c.getAttribute("data-full"); });
    var inflowFooter = clone.querySelector("footer"); /* moved to the running page footer */
    if (inflowFooter) inflowFooter.parentNode.removeChild(inflowFooter);
    wrapper.appendChild(clone);
    document.body.appendChild(wrapper);

    var root = document.documentElement;
    var hadAttr = root.hasAttribute("data-theme");
    var prevTheme = root.getAttribute("data-theme");
    root.setAttribute("data-theme", "light");

    try {
      var opts = {
        margin: [10, 10, 12, 10],
        image: { type: "jpeg", quality: 0.95 },
        html2canvas: {
          scale: 2, backgroundColor: "#ffffff", logging: false,
          /* ≥1024 so html2canvas' internal window never triggers the phone layout (max-width: 760px);
             the container itself is PDF_RENDER_WIDTH wide and pinned at x = 0. */
          windowWidth: Math.max(PDF_RENDER_WIDTH, 1024), x: 0, y: 0, scrollX: 0, scrollY: 0,
        },
        jsPDF: { unit: "mm", format: "a4", orientation: "portrait" },
        /* page breaks are placed by insertPageSpacers() — html2pdf's own avoid pass runs at the
           narrower pre-widening layout and would drop its spacers in the wrong places */
        pagebreak: { mode: ["css"], avoid: [] },
      };
      /* html2pdf 0.10.3's own toContainer() ignores html2canvas.windowWidth/opt.width entirely and
         always sizes its internal capture container to the PDF page's printable width (~718px for
         A4 portrait with these margins) — far narrower than this 980px-max-width report. Content
         that can't reflow below that (the KPI row, the wide tables) silently overflows past the
         container's right edge and gets cropped out of the canvas instead of being scaled down.
         Drive the pipeline manually so we can widen that container to match PDF_RENDER_WIDTH
         (same value as html2canvas.windowWidth and the offscreen wrapper above) right after it's
         created, before anything is rasterized. toPdf() still scales the resulting canvas down to
         the page's printable width, so the visual output/margins are unaffected. */
      return await global
        .html2pdf()
        .set(opts)
        .from(clone)
        .toContainer()
        .then(function () {
          /* html2pdf centers its container (left:0; right:0; margin:auto). On a viewport wider than
             PDF_RENDER_WIDTH that puts it at x = (viewport − width) / 2, but html2canvas renders the
             clone in a PDF_RENDER_WIDTH-wide window where it sits at x = 0 — the crop rectangle ends
             up shifted, cutting the left of the report and leaving the right half of the page blank.
             Pin the container to the left edge so both coordinate systems agree. */
          var c = this.prop.container.style;
          c.width = PDF_RENDER_WIDTH + "px";
          c.left = "0";
          c.right = "auto";
          c.margin = "0";
          /* Page breaks are computed on html2pdf's container — the DOM it rasterizes.
             The clone carries .pdf-desktop (app.css) so the phone layout never applies here either, which keeps
             this layout identical to html2canvas' own >=1024px window. Browsers cap canvas height (~32k px),
             so very long files get a lower scale; the page height is derived from the scale actually used. */
          var cont = this.prop.container;
          var scale = Math.min(2, Math.floor((30000 / (cont.getBoundingClientRect().height * 1.4)) * 100) / 100);
          this.opt.html2canvas.scale = scale;
          insertPageSpacers(cont, PDF_RENDER_WIDTH, scale);
          return this.toCanvas();
        })
        .then(function () {
          return this.toPdf();
        })
        .then(function () {
          if (footerText) addPageFooter(this.prop.pdf, footerText);
        })
        .then(function () {
          return this.outputPdf("blob");
        });
    } finally {
      if (hadAttr) {
        root.setAttribute("data-theme", prevTheme);
      } else {
        root.removeAttribute("data-theme");
      }
      document.body.removeChild(wrapper);
    }
  }

  /* One save prompt at a time: a back-to-back save can hit rate_limited while the previous
     prompt is closing — wait once and retry. */
  async function saveBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function slug(s) {
    return String(s).normalize("NFD").replace(/[\u0300-\u036f]/g, "")
      .replace(/[^A-Za-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "area";
  }

  function areaFilename(areas) {
    var part = areas.length <= 3 ? areas.map(slug).join("_") : areas.length + "-areas";
    return "Incidencias-Mejoras-GoLive-" + part + "-" + lastModel.fechaISO + ".pdf";
  }

  /* Per-area review form: the report data mapped onto the master template's config (the template
     itself holds no area-specific data). */
  function configRevision(model, opts) {
    var contacto = BitacoraRender.analista;
    var tickets = [];
    model.inventario.forEach(function (sec) {
      sec.filas.forEach(function (r) {
        tickets.push({
          id: r.code,
          url: r.url,
          descripcion: r.descCompleta || r.desc,
          relaciones: r.rel ? r.rel.split(/\s*\|\s*/).filter(Boolean) : [],
          clasificacion: r.gl === "Sin clasificar" ? null : r.gl,
          severidad: r.sev === "—" ? null : r.sev,
          espera: r.dias,
          estado: r.etapa === "Sin etapa" ? null : r.etapa,
          tipo: r.tipo,
          reabierto: !!r.reab
        });
      });
    });
    return {
      sistema: "Cosmos Connect",
      etapaProyecto: "Go Live",
      area: BitacoraRender.nombreAreas(model.areasSel || []),
      fechaEmision: model.fechaISO,
      datosActualizados: model.actualizadoISO,
      fechaLimite: opts.fechaLimite || null,
      gerenciaResponsable: opts.gerencia || null,
      destinatario: { nombre: contacto.nombre, correo: contacto.correo },
      periodicidad: opts.frecuencia || null,
      tablero: { nombre: model.tablero.nombreOriginal || model.tablero.nombre, url: model.tablero.url },
      tickets: tickets
    };
  }

  var busy = false;

  /* opts: {modo: "general"} or {modo: "area", areas: [...], porArea: bool} */
  async function exportarPdf(opts) {
    opts = opts || { modo: "general" };
    if (busy) return;
    if (opts.modo === "area" ? !(global.jspdf && global.PDFLib && global.BitacoraPlantilla) : !global.html2pdf) {
      showNotice(NOTICE.PDF_LOAD);
      return;
    }
    if (!dl) {
      showNotice(NOTICE.PDF_UNAVAILABLE);
      return;
    }
    if (!lastModel || !lastRaw) return;
    if (opts.modo === "area" && !(opts.areas && opts.areas.length)) return;

    busy = true;
    var btn = el("btn-pdf");
    var prevText = btn ? btn.textContent : "";
    if (btn) {
      btn.disabled = true;
      btn.textContent = "Generando PDF…";
    }
    updatePanelState();
    var status = el("status");
    var prevStatus = status ? status.textContent : "";

    try {
      if (opts.modo === "area") {
        var grupos = opts.porArea ? opts.areas.map(function (a) { return [a]; }) : [opts.areas];
        for (var i = 0; i < grupos.length; i++) {
          if (status) {
            status.textContent = "Generando PDF " + (grupos.length > 1 ? (i + 1) + " de " + grupos.length + " " : "") +
              "(" + grupos[i].join(", ") + ")…";
          }
          var model = BitacoraEngine.compute(lastRaw, { areas: grupos[i] });
          var hecho = await BitacoraPlantilla.generar(configRevision(model, {
            fechaLimite: opts.fechaLimite, frecuencia: opts.frecuencia,
            gerencia: (opts.gerencias || {})[claveGerencia(grupos[i])] || null
          }));
          await saveBlob(hecho.blob, areaFilename(grupos[i]));
        }
      } else {
        if (status) status.textContent = "Generando PDF…";
        var original = document.querySelector("#report .page");
        if (!original) return;
        var blob = await pdfBlobFrom(original, 900,
          "Cosmos Connect · Incidencias & Mejoras — Inventario Go Live · Actualizado " + lastModel.actualizado);
        await saveBlob(blob, "Incidencias-Mejoras-GoLive-" + lastModel.fechaISO + ".pdf");
      }
      closePanel();
    } catch (e) {
      /* "declined" stops the remaining per-area files silently */
      var msg = noticeForPdfError(e);
      if (msg) showNotice(msg);
    } finally {
      busy = false;
      if (status) status.textContent = prevStatus;
      if (btn) {
        btn.disabled = false;
        btn.textContent = prevText;
      }
      updatePanelState();
    }
  }

  /* ---- PDF options panel: General vs Por área ---- */
  var pdfSel = { modo: "general", areas: [], porArea: true, fechaLimite: "", frecuencia: "cada semana", gerencias: leerGerencias() };

  /* "Gerencia Responsable" is typed per area (or per combined file) before downloading and remembered
     in this browser so it doesn't have to be retyped next time. */
  var GERENCIAS_KEY = "incidencias-golive:gerencias";

  function leerGerencias() {
    try { return JSON.parse(global.localStorage.getItem(GERENCIAS_KEY) || "{}") || {}; } catch (e) { return {}; }
  }

  function guardarGerencias() {
    try { global.localStorage.setItem(GERENCIAS_KEY, JSON.stringify(pdfSel.gerencias)); } catch (e) { /* storage unavailable */ }
  }

  function claveGerencia(areas) { return areas.join(" + "); }

  function destinosGerencia() {
    if (!pdfSel.areas.length) return [];
    return pdfSel.porArea ? pdfSel.areas.map(function (x) { return [x]; }) : [pdfSel.areas.slice()];
  }

  var gerFirma = null;

  function renderGerencias() {
    var cont = el("pdf-ger");
    if (!cont) return;
    var destinos = destinosGerencia();
    var firma = destinos.map(claveGerencia).join("|");
    if (firma === gerFirma) return;             // same targets: keep the inputs (and the caret) as they are
    gerFirma = firma;
    cont.hidden = !destinos.length;
    cont.innerHTML = destinos.map(function (d, i) {
      var clave = claveGerencia(d);
      var etiqueta = destinos.length > 1 || d.length > 1 ? "Gerencia Responsable (" + escHtml(clave) + ")" : "Gerencia Responsable";
      return '<label>' + etiqueta + ' <input type="text" data-clave="' + escHtml(clave) + '" id="pdf-ger-' + i +
        '" value="' + escHtml(pdfSel.gerencias[clave] || "") + '" placeholder="Escriba la gerencia"></label>';
    }).join("") + '<span class="pdf-hint">Sin gerencia, el PDF sale marcado como borrador.</span>';
    Array.prototype.forEach.call(cont.querySelectorAll("input[data-clave]"), function (inp) {
      inp.addEventListener("input", function () {
        pdfSel.gerencias[inp.getAttribute("data-clave")] = inp.value.trim();
        guardarGerencias();
      });
    });
  }

  function areaCounts() {
    var counts = {};
    lastModel.inventario.forEach(function (s) {
      s.filas.forEach(function (r) {
        r.areas.forEach(function (a) { counts[a] = (counts[a] || 0) + 1; });
      });
    });
    return counts;
  }

  function renderPanel() {
    var p = el("pdf-panel");
    if (!p || !lastModel) return;
    gerFirma = null;
    var areas = lastModel.filtros.areas;
    var counts = areaCounts();
    pdfSel.areas = pdfSel.areas.filter(function (a) { return areas.indexOf(a) !== -1; });
    var general = pdfSel.modo === "general";
    p.innerHTML =
      '<div class="pdf-modes">' +
      '<label><input type="radio" name="pdf-modo" value="general"' + (general ? " checked" : "") + "> <b>General</b>" +
      '<span class="pdf-hint">— el reporte completo, como se ve ahora</span></label>' +
      '<label><input type="radio" name="pdf-modo" value="area"' + (general ? "" : " checked") + "> <b>Por área</b>" +
      '<span class="pdf-hint">— formulario de revisión para cada área, rellenable en el PDF</span></label>' +
      "</div>" +
      '<div class="pdf-areas' + (general ? " disabled" : "") + '" id="pdf-areas">' +
      areas.map(function (a) {
        return '<label><input type="checkbox" value="' + escHtml(a) + '"' +
          (pdfSel.areas.indexOf(a) !== -1 ? " checked" : "") + (general ? " disabled" : "") + "> " + escHtml(a) +
          ' <span class="area-n">' + (counts[a] || 0) + "</span></label>";
      }).join("") +
      "</div>" +
      (general ? "" :
        '<div class="pdf-extra">' +
        '<label>Fecha límite de respuesta <input type="date" id="pdf-fecha" value="' + escHtml(pdfSel.fechaLimite) + '"></label>' +
        '<span class="pdf-hint" id="pdf-fecha-nota"' + (pdfSel.fechaLimite ? " hidden" : "") + '>Sin fecha, el PDF sale marcado como borrador.</span>' +
        '<label>Avance a las áreas <select id="pdf-frec">' +
        ["cada semana", "cada dos semanas"].map(function (f) {
          return '<option value="' + f + '"' + (pdfSel.frecuencia === f ? " selected" : "") + ">" + f + "</option>";
        }).join("") + "</select></label>" +
        "</div>" +
        '<div class="pdf-extra pdf-ger" id="pdf-ger" hidden></div>' +
        '<div class="pdf-msg" id="pdf-msg-wrap"><div class="pdf-msg-head"><span>Mensaje sugerido para enviar con el PDF</span>' +
        '<button type="button" id="pdf-copy">Copiar</button></div><textarea id="pdf-msg" spellcheck="false"></textarea></div>') +
      '<div class="pdf-row">' +
      '<span class="links" id="pdf-links"><button type="button" id="pdf-all">Marcar todas</button> · ' +
      '<button type="button" id="pdf-none">Ninguna</button></span>' +
      '<label id="pdf-per-wrap"><input type="checkbox" id="pdf-per"' + (pdfSel.porArea ? " checked" : "") +
      "> Un archivo por área</label>" +
      '<span class="pdf-actions"><button type="button" id="pdf-cancel">Cancelar</button>' +
      '<button type="button" class="primary" id="pdf-go">Descargar</button></span>' +
      "</div>";

    Array.prototype.forEach.call(p.querySelectorAll('input[name="pdf-modo"]'), function (r) {
      r.addEventListener("change", function () {
        pdfSel.modo = r.value;
        renderPanel();
      });
    });
    Array.prototype.forEach.call(p.querySelectorAll("#pdf-areas input"), function (c) {
      c.addEventListener("change", function () {
        pdfSel.areas = Array.prototype.filter.call(p.querySelectorAll("#pdf-areas input"), function (x) {
          return x.checked;
        }).map(function (x) { return x.value; });
        updatePanelState();
      });
    });
    el("pdf-all").addEventListener("click", function () { pdfSel.areas = areas.slice(); renderPanel(); });
    el("pdf-none").addEventListener("click", function () { pdfSel.areas = []; renderPanel(); });
    el("pdf-per").addEventListener("change", function () { pdfSel.porArea = el("pdf-per").checked; updatePanelState(); });
    el("pdf-cancel").addEventListener("click", closePanel);
    if (!general) {
      el("pdf-fecha").addEventListener("change", function () {
        pdfSel.fechaLimite = el("pdf-fecha").value;
        el("pdf-fecha-nota").hidden = !!pdfSel.fechaLimite;
        updatePanelState();
      });
      el("pdf-frec").addEventListener("change", function () { pdfSel.frecuencia = el("pdf-frec").value; });
      el("pdf-copy").addEventListener("click", copiarMensaje);
    }
    el("pdf-go").addEventListener("click", function () {
      exportarPdf({ modo: pdfSel.modo, areas: pdfSel.areas.slice(), porArea: pdfSel.porArea,
        fechaLimite: pdfSel.fechaLimite || null, frecuencia: pdfSel.frecuencia,
        gerencias: JSON.parse(JSON.stringify(pdfSel.gerencias)) });
    });
    updatePanelState();
  }

  function updatePanelState() {
    var go = el("pdf-go");
    if (!go) return;
    var general = pdfSel.modo === "general";
    var n = pdfSel.areas.length;
    go.disabled = busy || (!general && n === 0);
    go.textContent = busy ? "Generando…" : (!general && n > 1 && pdfSel.porArea ? "Descargar " + n + " PDF" : "Descargar");
    el("pdf-per-wrap").hidden = general || n < 2;
    el("pdf-links").hidden = general;
    if (!general) renderGerencias();
    var msg = el("pdf-msg");
    if (msg) {
      el("pdf-msg-wrap").hidden = n === 0;
      msg.value = n ? mensajes() : "";
    }
  }

  /* One message per area (or one for the combined file), same wording as the PDF's letter. */
  function mensajes() {
    var grupos = pdfSel.porArea ? pdfSel.areas.map(function (a) { return [a]; }) : [pdfSel.areas];
    return grupos.map(function (g) {
      var m = BitacoraEngine.compute(lastRaw, { areas: g });
      var txt = BitacoraRender.mensajeArea(m, { fechaLimite: pdfSel.fechaLimite || null });
      return grupos.length > 1 ? "——— " + g.join(", ") + " ———\n" + txt : txt;
    }).join("\n\n");
  }

  function copiarMensaje() {
    var msg = el("pdf-msg");
    var btn = el("pdf-copy");
    function done(ok) {
      btn.textContent = ok ? "Copiado ✓" : "Selecciónalo y cópialo";
      setTimeout(function () { btn.textContent = "Copiar"; }, 2500);
    }
    msg.focus();
    msg.select();
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(msg.value).then(function () { done(true); }, function () {
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        done(ok);
      });
    } else {
      var ok2 = false;
      try { ok2 = document.execCommand("copy"); } catch (e) { ok2 = false; }
      done(ok2);
    }
  }

  function closePanel() {
    var p = el("pdf-panel");
    if (p) p.hidden = true;
  }

  function togglePanel() {
    var p = el("pdf-panel");
    if (!p) return;
    if (p.hidden) {
      renderPanel();
      p.hidden = false;
    } else {
      closePanel();
    }
  }

  async function boot() {
    var refreshBtn = el("btn-refresh");
    if (refreshBtn) refreshBtn.addEventListener("click", function () { load({ refresh: true }); });
    var pdfBtn = el("btn-pdf");
    if (pdfBtn) pdfBtn.addEventListener("click", togglePanel);

    document.addEventListener("visibilitychange", function () {
      if (document.visibilityState === "visible" && Date.now() - lastLoadTime > 15 * 60 * 1000) {
        load({ refresh: false });
      }
    });

    await load({ refresh: false });
  }

  global.BitacoraApp = {
    load: load,
    exportarPdf: exportarPdf,
    getModel: function () {
      return lastModel;
    },
  };

  if (typeof document !== "undefined") {
    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", boot);
    } else {
      boot();
    }
  }
})(typeof window !== "undefined" ? window : this);

</script>

</body></html>
